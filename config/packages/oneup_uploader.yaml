oneup_uploader:
  mappings:
    business:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.business_images_filesystem
      allowed_mimetypes:
        image/jpg: []
        image/jpeg: []
        image/png: []
        image/jfif: []
    listing:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.listing_images_filesystem
      allowed_mimetypes:
        image/jpg: []
        image/jpeg: []
        image/png: []
        image/jfif: []
    product:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.product_images_filesystem
      allowed_mimetypes:
        image/jpg: []
        image/jpeg: []
        image/png: []
        image/jfif: []
    logo:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.assets_filesystem
      namer: App\Utils\LogoNamer
      allowed_mimetypes:
        image/png: []
    listings:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.listing_imports_filesystem
      allowed_mimetypes:
        application/vnd.oasis.opendocument.spreadsheet: []
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: []
        application/vnd.ms-excel: []
        application/octet-stream: []
        text/csv: []
        text/plain: []
    products:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.product_imports_filesystem
      allowed_mimetypes:
        application/vnd.oasis.opendocument.spreadsheet: []
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: []
        application/vnd.ms-excel: []
        application/octet-stream: []
        text/csv: []
        text/plain: []
    banner:
      frontend: dropzone
      storage:
        type: flysystem
        filesystem: oneup_flysystem.assets_filesystem
      namer: App\Utils\BannerNamer
      allowed_mimetypes:
        text/html: ['svg']
        image/svg+xml: ['svg']
        image/svg: ['svg']
