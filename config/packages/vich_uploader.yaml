vich_uploader:
  db_driver: orm
  storage: flysystem
  mappings:
    business_image:
      uri_prefix: ''
      upload_destination: business_images_filesystem
      namer: vich_uploader.namer_uniqid
      directory_namer:
        service: vich_uploader.directory_namer_subdir
        options:
          chars_per_dir: 2
          dirs: 2
    store_image:
      uri_prefix: ''
      upload_destination: store_images_filesystem
      namer: vich_uploader.namer_uniqid
      directory_namer:
        service: vich_uploader.directory_namer_subdir
        options:
          chars_per_dir: 2
          dirs: 2
    listing_image:
      uri_prefix: ''
      upload_destination: listing_images_filesystem
      namer: vich_uploader.namer_uniqid
      directory_namer:
        service: vich_uploader.directory_namer_subdir
        options:
          chars_per_dir: 2
          dirs: 2
    product_image:
      uri_prefix: ''
      upload_destination: product_images_filesystem
      namer: vich_uploader.namer_uniqid
      directory_namer:
        service: vich_uploader.directory_namer_subdir
        options:
          chars_per_dir: 2
          dirs: 2
