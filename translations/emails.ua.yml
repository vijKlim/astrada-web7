covid_19.subject: COVID-19 | Важливі вказівки щодо вашого замовлення
covid_19.body: "<h1> Вказівки щодо доставки </h1> \ n <p> Враховуючи поточні \
  \ Пандемія COVID-19 (коронавірус), ви <strong> повинні суворо </strong> дотримуватися \
  \ такі інструкції: </p> \ n <h2> 1. Поважайте соціальне дистанціювання </h2> \ n <p> Ми \
  \ відкине ваше замовлення на вашому порозі, тому вам не доведеться підходити до людини \
  \ хто приходить доставити. Також не потрібно залишати чайові. </p> \ n <h2> 2. Розпакувати \
  \ ваше замовлення після отримання </h2> \ n <p> Вірус може вижити на картоні та пластику \
  \ поверхонь протягом декількох днів. Тому упаковка - це шлях ризику передачі \
  \ вірусу. \ n Тому ми просимо вас <strong> розпакувати замовлення та передати \
  \ вміст до табличок </strong>. </p> \ n <h2> 3. Утилізуйте упаковку </h2> \ n <p> Одноразово \
  \ ваше замовлення розпаковано, обов’язково <strong> утилізуйте упаковку у закритому вигляді \
  \ bin </strong>, щоб уникнути випадкового доторкання до нього пізніше. </p> \ n <h2> 4. Мийте руки! </h2> \ n \
  <p> Після того, як ви розпакували замовлення та викинули упаковку, <strong> вимийте \
  \ руки! </strong> </p> \ n "

